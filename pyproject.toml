[project]
name = "aied-helpers"
version = "0.1.0"
description = "Shared, provider-neutral helpers for the AI Engineering Demystified courses."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "langchain-core>=1.6",
    "langchain-openai>=1.6",
]

[project.optional-dependencies]
groq = ["langchain-groq>=1.1"]
databricks = ["databricks-langchain>=0.20"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.13"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aied_helpers"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
